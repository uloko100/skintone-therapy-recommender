<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkinTone Therapy Recommender</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1e293b; }
  h1 { color: #0f766e; font-size: 1.5rem; }
  label { display: block; margin-top: 1rem; font-weight: bold; }
  select, input { width: 100%; padding: 0.5rem; margin-top: 0.3rem; box-sizing: border-box; }
  button { margin-top: 1.5rem; padding: 0.7rem 1.2rem; background: #0f766e; color: #fff; border: 0; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  .card { background: #f1f5f9; border-left: 5px solid #0f766e; padding: 0.7rem 1rem; margin-top: 0.7rem; }
  .note { font-size: 0.85rem; color: #64748b; margin-top: 1.5rem; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
<h1>SkinTone Therapy Recommender</h1>
<p>Tell us about your skin to get suggested facial therapies.</p>

<form id="form">
  <label>Skin tone (Monk scale, 1 = lightest, 10 = darkest)
    <input type="number" id="monk_tone" min="1" max="10" value="5" required></label>
  <label>Age
    <input type="number" id="age" min="16" max="65" value="25" required></label>
  <label>Skin type
    <select id="skin_type">
      <option>dry</option><option>oily</option><option>combination</option><option>normal</option>
    </select></label>
  <label>Main concern
    <select id="skin_concern">
      <option>acne</option><option>hyperpigmentation</option><option>dryness</option>
      <option>fine_lines</option><option>redness</option><option>dullness</option>
    </select></label>
  <label>Is your skin sensitive?
    <select id="sensitive"><option value="0">No</option><option value="1">Yes</option></select></label>
  <button type="submit">Get recommendation</button>
</form>

<div id="result"></div>

<script>
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const result = document.getElementById("result");
  result.innerHTML = "Thinking...";
  const body = {
    monk_tone: Number(document.getElementById("monk_tone").value),
    age: Number(document.getElementById("age").value),
    skin_type: document.getElementById("skin_type").value,
    skin_concern: document.getElementById("skin_concern").value,
    sensitive: Number(document.getElementById("sensitive").value),
  };
  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const data = await res.json();
    result.innerHTML = "<h2>Recommended therapies</h2>" +
      data.recommendations.map((r, i) =>
        `<div class="card"><strong>${i + 1}. ${r.therapy}</strong><br>Confidence: ${(r.confidence * 100).toFixed(1)}%</div>`
      ).join("") +
      `<p class="note">${data.disclaimer}</p>`;
  } catch (err) {
    result.innerHTML = `<p class="error">Something went wrong: ${err.message}</p>`;
  }
});
</script>
</body>
</html>
